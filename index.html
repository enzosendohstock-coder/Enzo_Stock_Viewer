<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>首頁</h1>

  <div id="marketSummaryStatus" class="placeholder-text"></div>

  <section class="panel">
    <h2>三大法人買賣金額統計表</h2>
    <div class="table-scroll">
      <table id="institutionalTable">
        <thead>
          <tr>
            <th>單位名稱</th>
            <th>買賣差額(億元)</th>
            <th>買進金額(億元)</th>
            <th>賣出金額(億元)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>信用交易統計</h2>
    <div class="table-scroll">
      <table id="creditTable">
        <thead>
          <tr>
            <th>項目</th>
            <th>今日餘額</th>
            <th>前日餘額</th>
            <th>現金(券)償還</th>
            <th>買進</th>
            <th>賣出</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>期貨/選擇權三大法人</h2>
    <div class="table-scroll">
      <table id="futuresTable">
        <thead>
          <tr>
            <th>契約</th>
            <th>身份別</th>
            <th>淨未平倉口數</th>
            <th>淨口數</th>
            <th>淨契約金額(億元)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="market-summary.js"></script>
  <script src="nav.js"></script>
</body>
</html>
