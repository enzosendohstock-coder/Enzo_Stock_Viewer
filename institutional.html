<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大法人買賣超</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>三大法人買賣超</h1>

  <div class="controls">
    <label>
      股票代號 / 名稱
      <input type="text" id="stockSelect" placeholder="代號或名稱，例如 2379 或 瑞昱" autocomplete="off">
      <div id="stockSuggestions" class="autocomplete-suggestions"></div>
    </label>
    <label>
      開始日期
      <input type="date" id="startDate">
    </label>
    <label>
      結束日期
      <input type="date" id="endDate">
    </label>
    <label>
      圖表指標
      <select id="metricSelect">
        <option value="grand">三大法人合計</option>
        <option value="foreign">外資</option>
        <option value="trust">投信</option>
        <option value="dealer">自營商</option>
      </select>
    </label>
  </div>

  <div id="status"></div>

  <div id="chartInfo" class="chart-info"></div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="table-scroll">
    <table id="dataTable">
      <thead>
        <tr>
          <th>日期</th>
          <th>股票代號</th>
          <th>股票名稱</th>
          <th>外資</th>
          <th>投信</th>
          <th>自營</th>
          <th>買賣超</th>
          <th>外資持股比率</th>
          <th>外資買賣超佔股本</th>
          <th id="cumulativeHeader">累計</th>
        </tr>
        <tr class="summary-row">
          <td>
            <select id="summaryDays">
              <option value="5">近5日</option>
              <option value="10">近10日</option>
              <option value="20">近20日</option>
              <option value="30">近30日</option>
              <option value="60">近60日</option>
            </select>
          </td>
          <td></td>
          <td id="summaryRange">合計</td>
          <td id="summaryForeign"></td>
          <td id="summaryTrust"></td>
          <td id="summaryDealer"></td>
          <td id="summaryGrand"></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="stock-autocomplete.js"></script>
  <script src="app.js"></script>
  <script src="nav.js"></script>
</body>
</html>
