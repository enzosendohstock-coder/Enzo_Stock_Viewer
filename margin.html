<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>融資融券借券</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>融資融券借券</h1>

  <div class="controls">
    <label>
      股票代號
      <select id="stockSelect"></select>
    </label>
    <label>
      開始日期
      <input type="date" id="startDate">
    </label>
    <label>
      結束日期
      <input type="date" id="endDate">
    </label>
    <label>
      圖表指標
      <select id="metricSelect">
        <option value="margin">融資餘額</option>
        <option value="short">融券餘額</option>
        <option value="offsetting">資券相抵(當沖)</option>
        <option value="sbl">借券賣出餘額</option>
      </select>
    </label>
  </div>

  <p class="placeholder-text">
    注意：「借券賣出餘額」只統計借券後直接放空賣出的量，是 TWSE/TPEx 官方公開資料裡可以查到的數字；
    不含避險、套利等其他借券用途的完整借券市場餘額。
  </p>

  <div id="status"></div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <table id="dataTable">
    <thead>
      <tr>
        <th>日期</th>
        <th>股票代號</th>
        <th>股票名稱</th>
        <th>融資餘額</th>
        <th>融資使用率</th>
        <th>融券餘額</th>
        <th>融券使用率</th>
        <th>資券相抵</th>
        <th>借券賣出餘額</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="margin.js"></script>
  <script src="nav.js"></script>
</body>
</html>
