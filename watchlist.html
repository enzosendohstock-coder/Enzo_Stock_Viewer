<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增追蹤股票</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>新增追蹤股票</h1>

  <section class="panel">
    <p class="placeholder-text">
      輸入股票代號即可加入追蹤清單，當天排程就會自動抓取三大法人買賣超資料，
      並自動回補 2026/01/01 以來的歷史資料(上市股票適用；上櫃股票受限於資料來源，僅能從加入當天開始累積)。<br>
      請自行確認代號正確，加入後請稍等排程執行(每天 17:30、18:30)完成回補。
    </p>

    <form id="watchlistForm" class="watchlist-form">
      <label>
        股票代號 / 名稱
        <input type="text" id="stockCode" name="stockCode" list="stockOptions" placeholder="代號、簡稱或全名皆可，例如 2395 或 研華" autocomplete="off" required>
        <datalist id="stockOptions"></datalist>
      </label>
      <label class="honeypot-field" aria-hidden="true">
        請勿填寫
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </label>
      <button type="submit" id="submitBtn">新增</button>
    </form>

    <div id="stockPreview" class="stock-preview"></div>
    <div id="formMessage" class="form-message"></div>
  </section>

  <section class="panel">
    <h2>目前追蹤清單</h2>
    <div id="watchlistStatus" class="placeholder-text">載入中...</div>
    <div class="table-scroll">
      <table id="watchlistTable">
        <thead>
          <tr>
            <th>股票代號</th>
            <th>簡稱</th>
            <th>全名</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="watchlist.js"></script>
  <script src="nav.js"></script>
</body>
</html>
